[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Offline-first, safety-aware computer-use agent research MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
desktop = ["pywinauto==0.6.9", "psutil>=5.9,<8"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"
sentinel-agent-web = "sentinel_agent.app:run"
sentinel-benchmark = "sentinel_agent.benchmark:main"

[tool.setuptools.packages.find]
include = ["sentinel_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
